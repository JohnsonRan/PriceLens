<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="extName">价译 · PriceLens</title>
  <link rel="stylesheet" href="popup.css">
  <script defer src="shared.js"></script>
  <script defer src="popup.js"></script>
</head>
<body>
  <header><img class="logo" src="icons/icon128.png" alt="" aria-hidden="true"><h1>PriceLens<span data-i18n="brandLocal">价译</span></h1><span id="version" class="version"></span></header>
  <main>
    <form id="settings-form">
      <section class="hero">
        <label for="target" class="small-label" data-i18n="labelTarget">我的货币</label>
        <select id="target" name="target" required></select>
        <label class="switch-row" for="enabled"><span data-i18n="labelEnabled">自动换算</span><input id="enabled" type="checkbox" role="switch" checked></label>
      </section>
      <label class="check-row site-row"><input id="pause-site" type="checkbox"><span><span data-i18n="labelPauseSite">暂停此网站</span> <small id="site-name" data-i18n="loading">读取中…</small></span></label>
      <section class="rate-status" aria-label="当前汇率状态" data-i18n-aria-label="ariaRateStatus">
        <div class="status-heading"><span class="dot" aria-hidden="true"></span><strong id="status-title" data-i18n="statusReading">正在读取汇率…</strong><span id="source-badge">—</span></div>
      </section>
      <details id="advanced-settings">
        <summary data-i18n="summaryAdvanced">汇率、识别与 AI</summary>
        <div class="fields">
          <label for="provider" data-i18n="labelProvider">汇率来源</label>
          <select id="provider" name="provider">
            <option value="ecb" data-i18n="optionEcb">央行免费参考汇率 · 日更</option>
            <option value="wise" data-i18n="optionWise">Wise 中间价 · 需 Token</option>
          </select>
          <p id="provider-hint" class="hint"></p>
          <details id="credentials" hidden>
            <summary>Wise Token <span id="token-state"></span></summary>
            <label for="token" class="sr-only" data-i18n="labelToken">你的 Wise Token</label>
            <input id="token" type="password" autocomplete="off" spellcheck="false" maxlength="4096">
            <label class="check-row" id="clear-token-row"><input id="clear-token" type="checkbox"><span data-i18n="clearToken">清除 Token（先切回央行汇率）</span></label>
            <p class="hint" data-i18n="hintLocalOnly">仅保存在本机，不传给网页。</p>
          </details>
          <label for="source-hint" data-i18n="labelSourceHint">网页原币种</label>
          <select id="source-hint" name="sourceHint" aria-describedby="recognition-hint"><option value="" data-i18n="optionAutoDetect">自动识别币种</option></select>
          <p id="recognition-hint" class="hint" data-i18n="loading">读取中…</p>
          <label class="check-row"><input id="savings-enabled" type="checkbox" aria-describedby="savings-hint"><span data-i18n="labelSavings">显示参考标价差</span></label>
          <p id="savings-hint" class="hint" data-i18n="hintSavings">原价减现价。只用页面标注的原价或划线价，在本地计算，不发送网页内容。</p>
          <details id="ai-settings">
            <summary><span data-i18n="summaryAi">AI 辅助</span> <span id="jev-state" data-i18n="stateOff">· 关闭</span></summary>
            <p id="ai-consent" class="hint consent"><span data-i18n="aiConsent">开启后，会在未暂停的网站自动向 TypeSafe 发送价格和附近文字（每项最多 360 字符），用于币种识别。可能收费；不发送整页，片段仍可能含私人或敏感信息，请勿在敏感页面启用。</span><a href="https://github.com/JohnsonRan/PriceLens/blob/main/PRIVACY.md" target="_blank" rel="noreferrer" data-i18n="linkPrivacyNote">隐私说明 ↗</a></p>
            <label class="check-row"><input id="jev-enabled" type="checkbox" aria-describedby="ai-consent"><span data-i18n="labelJevEnabled">启用 AI，并同意上述发送</span></label>
            <a id="jev-key-link" href="https://console.typesafe.ai/" target="_blank" rel="noreferrer" data-i18n="linkGet">获取 ↗</a><label for="jev-key">TypeSafe Key</label>
            <input id="jev-key" type="password" autocomplete="off" spellcheck="false" maxlength="4096" placeholder="仅保存在本机" data-i18n-placeholder="placeholderLocalOnly">
            <label class="check-row" id="clear-jev-row"><input id="clear-jev" type="checkbox"><span data-i18n="clearJev">清除 Key（先关闭 AI）</span></label>
          </details>
          <details id="diagnostics">
            <summary data-i18n="summaryDiagnostics">诊断</summary>
            <p id="status-detail" class="hint" data-i18n="loading">读取中…</p>
            <p id="jev-status" class="hint" role="status"></p>
            <p class="hint" data-i18n="hintModelStatus">模型状态来自所有标签页的最近一批，后台重启会重置。</p>
          </details>
        </div>
      </details>
      <div class="save-area">
        <div class="actions"><button id="save" type="submit" disabled data-i18n="buttonSave">保存</button><button id="refresh" type="button" class="secondary" disabled data-i18n="buttonRefresh">刷新汇率</button></div>
        <p id="notice" role="status" aria-live="polite"></p>
      </div>
    </form>
  </main>
  <footer><a href="https://github.com/JohnsonRan/PriceLens#readme" target="_blank" rel="noreferrer" data-i18n="footerHelp">使用帮助 ↗</a><a href="https://github.com/JohnsonRan/PriceLens/blob/main/PRIVACY.md" target="_blank" rel="noreferrer" data-i18n="footerPrivacy">隐私</a><span id="privacy-state"></span><span data-i18n="footerEstimate">估算 · 不含手续费</span></footer>
</body>
</html>
