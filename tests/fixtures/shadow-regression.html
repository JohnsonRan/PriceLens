<!doctype html>
<html><head><meta charset="utf-8"><title>PriceLens shadow DOM regression</title>
<link rel="stylesheet" href="../../extension/content.css">
<style>body{font:16px Arial;background:#fff;color:#222}section{margin:8px;padding:8px}</style></head><body>
<section id="light"><p>USD 1</p></section>
<section><product-card id="open-card"></product-card></section>
<section><product-card id="closed-card" data-mode="closed"></product-card></section>
<section><outer-card id="nested"></outer-card></section>
<section><product-card id="late-card" data-late="1"></product-card></section>
<pre id="dom-results">pending</pre>
<script>
customElements.define("product-card", class extends HTMLElement {
  connectedCallback() {
    const root = this.attachShadow({ mode: this.dataset.mode || "open" });
    root.innerHTML = this.dataset.late ? "<p>loading</p>" : this.dataset.mode ? "<p>USD 20</p>" : "<p><span>USD 10</span></p>";
  }
});
customElements.define("outer-card", class extends HTMLElement {
  connectedCallback() { this.attachShadow({ mode: "open" }).innerHTML = "<div><product-card></product-card></div>"; }
});
</script>
<script src="../../extension/shared.js"></script><script src="shadow-regression.js"></script><script src="../../extension/content.js"></script>
</body></html>
